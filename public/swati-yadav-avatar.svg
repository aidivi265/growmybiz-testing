<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1C31"/>
      <stop offset="50%" stop-color="#182A4A"/>
      <stop offset="100%" stop-color="#243B66"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Outer Rounded Square Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Ambient Inner Glow -->
  <circle cx="256" cy="200" r="220" fill="url(#glowGrad)"/>
  
  <!-- Subtle Framing Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="3"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="rgba(59, 130, 246, 0.20)" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- Minimalist Executive Silhouette / Accent Graphic -->
  <g opacity="0.12" fill="#FFFFFF">
    <circle cx="256" cy="190" r="90"/>
    <path d="M120 440 C120 330, 180 290, 256 290 C332 290, 392 330, 392 440 Z"/>
  </g>
  
  <!-- Editorial Monogram Initials "SY" -->
  <text 
    x="256" 
    y="300" 
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Syne', sans-serif" 
    font-size="168" 
    font-weight="800" 
    letter-spacing="-0.04em" 
    fill="url(#textGrad)" 
    text-anchor="middle"
    filter="drop-shadow(0 8px 24px rgba(0, 0, 0, 0.4))"
  >SY</text>

  <!-- Role Subtext Tag -->
  <rect x="176" y="380" width="160" height="34" rx="17" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
  <text 
    x="256" 
    y="402" 
    font-family="system-ui, -apple-system, sans-serif" 
    font-size="13" 
    font-weight="700" 
    letter-spacing="0.14em" 
    fill="#93C5FD" 
    text-anchor="middle"
  >CO-FOUNDER</text>
</svg>
