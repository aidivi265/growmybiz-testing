<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#E2E8F0"/>
  <!-- Cluttered 2012 era header -->
  <rect width="800" height="70" fill="#94A3B8"/>
  <rect x="30" y="20" width="140" height="30" fill="#64748B" rx="4"/>
  <text x="35" y="40" font-family="Arial" font-size="12" fill="#FFFFFF" font-weight="bold">OLD STORE 2018</text>
  <rect x="200" y="25" width="400" height="22" fill="#FFFFFF" rx="2" stroke="#CBD5E1"/>
  <!-- Warning banner -->
  <rect y="70" width="800" height="35" fill="#EF4444"/>
  <text x="400" y="92" font-family="Arial" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">WARNING: High Server Load • Checkout delays expected (4.8s TTFB)</text>
  <!-- Cluttered layout with small text -->
  <rect x="30" y="125" width="220" height="340" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="45" y="140" width="190" height="150" fill="#F1F5F9"/>
