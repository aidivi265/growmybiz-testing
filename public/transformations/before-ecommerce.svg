  <text x="45" y="315" font-family="Arial" font-size="12" fill="#1E293B" font-weight="bold">Generic Catalog Item #492</text>
  <text x="45" y="335" font-family="Arial" font-size="11" fill="#64748B">Outdated WooCommerce Layout</text>
  <rect x="45" y="355" width="100" height="26" fill="#94A3B8" rx="2"/>
  <text x="95" y="372" font-family="Arial" font-size="11" fill="#FFFFFF" text-anchor="middle">Buy Now</text>
  <!-- Second product -->
  <rect x="280" y="125" width="220" height="340" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="295" y="140" width="190" height="150" fill="#F1F5F9"/>
  <text x="390" y="220" font-family="Arial" font-size="12" fill="#94A3B8" text-anchor="middle">[Unoptimized Asset 2.4MB]</text>
  <text x="295" y="315" font-family="Arial" font-size="12" fill="#1E293B" font-weight="bold">Unresponsive Grid Item #493</text>
  <text x="295" y="335" font-family="Arial" font-size="11" fill="#64748B">High bounce rate on mobile</text>
  <rect x="295" y="355" width="100" height="26" fill="#94A3B8" rx="2"/>
  <text x="345" y="372" font-family="Arial" font-size="11" fill="#FFFFFF" text-anchor="middle">Buy Now</text>
  <!-- Sidebar -->
  <rect x="530" y="125" width="240" height="340" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="545" y="155" font-family="Arial" font-size="13" fill="#1E293B" font-weight="bold">Cluttered Sidebar Filters</text>
  <rect x="545" y="170" width="210" height="20" fill="#F8FAFC"/>
  <rect x="545" y="200" width="210" height="20" fill="#F8FAFC"/>
  <rect x="545" y="230" width="210" height="20" fill="#F8FAFC"/>
  <!-- Status Stamp -->
  <rect x="30" y="430" width="300" height="40" fill="#FEF2F2" stroke="#F87171" rx="6"/>
  <text x="45" y="455" font-family="Arial" font-size="13" fill="#DC2626" font-weight="bold">❌ 4.8s Load • 1.1% Conversion • Slow Checkout</text>
