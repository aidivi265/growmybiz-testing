<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#0A0F1D"/>
  <rect x="150" y="50" width="500" height="400" fill="#111827" rx="20" stroke="#374151"/>
  <!-- Chat Header -->
  <rect x="150" y="50" width="500" height="60" fill="#1F2937" rx="20"/>
  <circle cx="185" cy="80" r="15" fill="#10B981"/>
  <text x="215" y="78" font-family="system-ui, sans-serif" font-size="14" fill="#FFFFFF" font-weight="bold">AI Growth Copilot (24/7 Live)</text>
  <text x="215" y="93" font-family="system-ui, sans-serif" font-size="11" fill="#34D399">⚡ Average Response: 0.8s • WhatsApp Connected</text>
  <!-- Chat Message 1 (User) -->
  <rect x="380" y="130" width="245" height="42" fill="#374151" rx="14"/>
  <text x="395" y="156" font-family="system-ui, sans-serif" font-size="12" fill="#F3F4F6">Can you build a custom SaaS for real estate?</text>
  <!-- Chat Message 2 (AI Agent) -->
  <rect x="175" y="185" width="410" height="85" fill="#1E3A8A" fill-opacity="0.5" rx="14" stroke="#3B82F6"/>
  <text x="195" y="210" font-family="system-ui, sans-serif" font-size="12" fill="#93C5FD">Yes! We built PropertySync with multi-tenant MLS sync,</text>
  <text x="195" y="230" font-family="system-ui, sans-serif" font-size="12" fill="#93C5FD">virtual 3D tours, and automated WhatsApp lead routing.</text>
  <text x="195" y="252" font-family="system-ui, sans-serif" font-size="11" fill="#34D399" font-weight="bold">Estimated build: 4 weeks. Would you like a demo call?</text>
  <!-- Interactive CTA Buttons inside chat -->
  <rect x="175" y="285" width="180" height="34" fill="#25D366" rx="10"/>
  <text x="265" y="306" font-family="system-ui, sans-serif" font-size="11" fill="#FFFFFF" font-weight="bold" text-anchor="middle">💬 Continue on WhatsApp</text>
  <rect x="365" y="285" width="180" height="34" fill="#3B82F6" rx="10"/>
  <text x="455" y="306" font-family="system-ui, sans-serif" font-size="11" fill="#FFFFFF" font-weight="bold" text-anchor="middle">📅 Book Discovery Call</text>
  <!-- Bottom status -->
  <rect x="150" y="415" width="500" height="35" fill="#064E3B" rx="10" stroke="#10B981"/>
  <text x="400" y="438" font-family="system-ui, sans-serif" font-size="12" fill="#34D399" text-anchor="middle" font-weight="bold">✅ 24/7 Instant Responses • 94% Resolution Rate • +210% Leads</text>
</svg>