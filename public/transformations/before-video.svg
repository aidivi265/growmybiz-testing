<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#1E293B"/>
  <rect x="120" y="70" width="560" height="320" fill="#0F172A" rx="16" stroke="#475569"/>
  <!-- Static 2D Graphic Flyer -->
  <rect x="150" y="100" width="220" height="260" fill="#E2E8F0" rx="8"/>
  <text x="260" y="180" font-family="Arial" font-size="12" fill="#64748B" text-anchor="middle">[Static JPEG Flyer]</text>
  <text x="260" y="220" font-family="Arial" font-size="11" fill="#94A3B8" text-anchor="middle">Ignored on Social Feeds</text>
  <!-- Metrics table on the right -->
  <text x="400" y="130" font-family="Arial" font-size="14" fill="#F87171" font-weight="bold">❌ Static Creative Ad Performance</text>
  <rect x="400" y="150" width="250" height="50" fill="#450A0A" rx="8"/>
  <text x="415" y="170" font-family="Arial" font-size="10" fill="#FCA5A5">Average Hook Watch Time</text>
  <text x="415" y="190" font-family="Arial" font-size="14" fill="#EF4444" font-weight="bold">0.8 Seconds (91% Skip Rate)</text>
  <rect x="400" y="215" width="250" height="50" fill="#450A0A" rx="8"/>
  <text x="415" y="235" font-family="Arial" font-size="10" fill="#FCA5A5">Click-Through Rate (CTR)</text>
  <text x="415" y="255" font-family="Arial" font-size="14" fill="#EF4444" font-weight="bold">0.38% (High Ad Spend Burn)</text>
  <rect x="400" y="280" width="250" height="50" fill="#450A0A" rx="8"/>
  <text x="415" y="300" font-family="Arial" font-size="10" fill="#FCA5A5">Brand Perception</text>
  <text x="415" y="320" font-family="Arial" font-size="14" fill="#EF4444" font-weight="bold">Commoditized / Forgotten</text>
  <!-- Bottom banner -->
  <rect x="120" y="410" width="560" height="40" fill="#450A0A" rx="10" stroke="#EF4444"/>
  <text x="400" y="435" font-family="Arial" font-size="12" fill="#FCA5A5" text-anchor="middle" font-weight="bold">⚠️ Stagnant ROAS: Customers scroll past unmoving static posts in under a second.</text>
</svg>