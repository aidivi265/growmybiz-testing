<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="flutterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="#0A0F1D"/>
  <!-- Phone Frame Mockup -->
  <rect x="275" y="40" width="250" height="420" rx="36" fill="#111827" stroke="#38BDF8" stroke-width="3"/>
  <rect x="350" y="52" width="100" height="14" rx="7" fill="#1F2937"/>
  <!-- Screen content: Modern Native App -->
  <rect x="290" y="75" width="220" height="365" fill="#030712" rx="16"/>
  <!-- App Header -->
  <text x="310" y="105" font-family="system-ui, sans-serif" font-size="12" fill="#9CA3AF">Good morning,</text>
  <text x="310" y="125" font-family="system-ui, sans-serif" font-size="16" fill="#FFFFFF" font-weight="bold">Sarah Jenkins ⚡</text>
  <!-- Balance / Quick Action Card -->
  <rect x="305" y="145" width="190" height="85" fill="url(#flutterGrad)" rx="14"/>
  <text x="320" y="170" font-family="system-ui, sans-serif" font-size="10" fill="#E0F2FE">FastCart Portfolio</text>
  <text x="320" y="195" font-family="system-ui, sans-serif" font-size="20" fill="#FFFFFF" font-weight="bold">₹1,48,290</text>
  <text x="320" y="218" font-family="system-ui, sans-serif" font-size="10" fill="#A7F3D0">▲ +18.4% this month</text>
  <!-- Native Gesture Card -->
  <rect x="305" y="245" width="190" height="60" fill="#1F2937" rx="12" stroke="#374151"/>
  <text x="320" y="270" font-family="system-ui, sans-serif" font-size="11" fill="#FFFFFF" font-weight="bold">Instant 1-Tap Biometric Pay</text>
  <text x="320" y="290" font-family="system-ui, sans-serif" font-size="9" fill="#9CA3AF">60 FPS Native Flutter Engine</text>
  <!-- App Store Rating -->
  <text x="400" y="340" font-family="system-ui, sans-serif" font-size="16" fill="#FBBF24" text-anchor="middle">★★★★★ (4.9/5)</text>
  <text x="400" y="360" font-family="system-ui, sans-serif" font-size="10" fill="#34D399" text-anchor="middle">Featured on App Store Top 10</text>
  <!-- Bottom nav pill in phone -->
  <rect x="320" y="390" width="160" height="36" fill="#111827" rx="18" stroke="#38BDF8"/>
  <circle cx="350" cy="408" r="6" fill="#38BDF8"/>
  <circle cx="400" cy="408" r="6" fill="#64748B"/>
  <circle cx="450" cy="408" r="6" fill="#64748B"/>
  <!-- Left & Right Metrics Cards -->
  <rect x="35" y="180" width="210" height="90" fill="#064E3B" rx="14" stroke="#10B981"/>
  <text x="50" y="210" font-family="system-ui, sans-serif" font-size="12" fill="#34D399" font-weight="bold">✅ 60 FPS Native Performance</text>
  <text x="50" y="235" font-family="system-ui, sans-serif" font-size="11" fill="#A7F3D0">Zero stutter • 99.98% crash-free</text>
  <text x="50" y="255" font-family="system-ui, sans-serif" font-size="11" fill="#6EE7B7">120k Monthly Active Users</text>
  <rect x="555" y="180" width="210" height="90" fill="#064E3B" rx="14" stroke="#10B981"/>
  <text x="570" y="210" font-family="system-ui, sans-serif" font-size="12" fill="#34D399" font-weight="bold">✅ Automated Push Engagement</text>
  <text x="570" y="235" font-family="system-ui, sans-serif" font-size="11" fill="#A7F3D0">+41% Repeat Purchase Rate</text>
  <text x="570" y="255" font-family="system-ui, sans-serif" font-size="11" fill="#6EE7B7">Sub-50ms instant biometrics</text>
</svg>