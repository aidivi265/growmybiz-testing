<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#brandGrad)"/>
  <!-- Minimalist Luxury Identity -->
  <rect x="100" y="70" width="600" height="280" fill="#0B132B" rx="20" stroke="#334155"/>
  <!-- Logo Mark -->
  <polygon points="400,110 440,170 360,170" fill="url(#goldGrad)"/>
  <polygon points="400,180 440,120 360,120" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
  <text x="400" y="225" font-family="system-ui, sans-serif" font-size="28" fill="#FFFFFF" font-weight="bold" letter-spacing="8" text-anchor="middle">A P E X</text>
  <text x="400" y="255" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8" letter-spacing="4" text-anchor="middle">PRIVATE WEALTH &amp; ADVISORY</text>
  <!-- Design tokens swatch preview -->
  <circle cx="340" cy="300" r="12" fill="#020617" stroke="#475569"/>
  <circle cx="375" cy="300" r="12" fill="#1E293B"/>
  <circle cx="410" cy="300" r="12" fill="#F59E0B"/>
  <circle cx="445" cy="300" r="12" fill="#FCD34D"/>
  <!-- Bottom Lift Badge -->
  <rect x="100" y="380" width="600" height="60" fill="#064E3B" rx="14" stroke="#10B981"/>
  <text x="400" y="407" font-family="system-ui, sans-serif" font-size="14" fill="#34D399" text-anchor="middle" font-weight="bold">✅ Premium Identity System • 3.2x Average Contract Value</text>
  <text x="400" y="427" font-family="system-ui, sans-serif" font-size="12" fill="#6EE7B7" text-anchor="middle">Positioned client alongside tier-one global private wealth firms.</text>
</svg>