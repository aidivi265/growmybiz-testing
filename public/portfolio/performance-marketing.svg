<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" rx="16" fill="#0C1422"/>
  <rect x="0.5" y="0.5" width="799" height="499" rx="15.5" stroke="#1D2E44"/>
  
  <circle cx="200" cy="180" r="160" fill="#6477C8" fill-opacity="0.12" filter="blur(60px)"/>
  <circle cx="650" cy="350" r="160" fill="#477BDB" fill-opacity="0.12" filter="blur(60px)"/>

  <!-- Performance Marketing Analytics View -->
  <g transform="translate(45, 35)">
    <rect width="710" height="430" rx="12" fill="#111E30" stroke="#223652"/>
    
    <!-- Header -->
    <rect width="710" height="45" rx="12" fill="#0E1928"/>
    <text x="25" y="28" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="800">META &amp; GOOGLE ADS CAMPAIGN MANAGER</text>
    <rect x="580" y="11" width="105" height="23" rx="6" fill="#32A88A"/>
    <text x="632" y="27" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">ROAS 4.2x</text>

    <!-- Top KPI Grid -->
    <g transform="translate(25, 60)">
      <!-- KPI 1 -->
      <rect width="150" height="80" rx="8" fill="#172942" stroke="#263E61"/>
      <text x="14" y="25" fill="#8BA5C8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">TOTAL AD SPEND</text>
      <text x="14" y="52" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="20" font-weight="800">₹3,40,000</text>
      <text x="14" y="68" fill="#8BA5C8" font-family="system-ui, sans-serif" font-size="10">90-Day Sprint</text>
      
      <!-- KPI 2 -->
      <g transform="translate(170, 0)">
        <rect width="150" height="80" rx="8" fill="#172942" stroke="#263E61"/>
        <text x="14" y="25" fill="#8BA5C8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">ATTRIBUTED REVENUE</text>
        <text x="14" y="52" fill="#4DD8B0" font-family="system-ui, sans-serif" font-size="20" font-weight="800">₹14,28,000</text>
        <text x="14" y="68" fill="#4DD8B0" font-family="system-ui, sans-serif" font-size="10">Blended 4.2x ROAS</text>
      </g>

      <!-- KPI 3 -->
      <g transform="translate(340, 0)">
        <rect width="150" height="80" rx="8" fill="#172942" stroke="#263E61"/>
        <text x="14" y="25" fill="#8BA5C8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">COST PER ACQ. (CAC)</text>
        <text x="14" y="52" fill="#6AADFF" font-family="system-ui, sans-serif" font-size="20" font-weight="800">₹420</text>
        <text x="14" y="68" fill="#32A88A" font-family="system-ui, sans-serif" font-size="10">▼ 38% vs prev. baseline</text>
      </g>

      <!-- KPI 4 -->
      <g transform="translate(510, 0)">
        <rect width="150" height="80" rx="8" fill="#172942" stroke="#263E61"/>
        <text x="14" y="25" fill="#8BA5C8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">CONVERSION RATE</text>
        <text x="14" y="52" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="20" font-weight="800">3.85%</text>
        <text x="14" y="68" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="10">Landing page optimized</text>
      </g>
    </g>

    <!-- Funnel Visualization & Creatives -->
    <g transform="translate(25, 155)">
      <!-- Funnel Chart Card -->
      <rect width="400" height="240" rx="10" fill="#15263D" stroke="#243C5E"/>
      <text x="20" y="30" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Funnel Drop-off &amp; Retention Efficiency</text>
      
      <!-- Funnel Bars -->
      <g transform="translate(20, 50)">
        <!-- Stage 1 -->
        <rect width="360" height="32" rx="6" fill="#477BDB" fill-opacity="0.25"/>
        <rect width="360" height="32" rx="6" stroke="#477BDB" fill="none"/>
        <text x="14" y="21" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Ad Impressions (Top of Funnel)</text>
        <text x="310" y="21" fill="#6AADFF" font-family="system-ui, sans-serif" font-size="11" font-weight="800">1.84M</text>

        <!-- Stage 2 -->
        <g transform="translate(25, 42)">
          <rect width="310" height="32" rx="6" fill="#6477C8" fill-opacity="0.3"/>
          <rect width="310" height="32" rx="6" stroke="#6477C8" fill="none"/>
          <text x="14" y="21" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Link Clicks &amp; Visits (CTR 3.4%)</text>
          <text x="260" y="21" fill="#92AEED" font-family="system-ui, sans-serif" font-size="11" font-weight="800">62,500</text>
        </g>

        <!-- Stage 3 -->
        <g transform="translate(55, 84)">
          <rect width="250" height="32" rx="6" fill="#32A88A" fill-opacity="0.3"/>
          <rect width="250" height="32" rx="6" stroke="#32A88A" fill="none"/>
          <text x="14" y="21" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Add to Cart Intent</text>
          <text x="205" y="21" fill="#4DD8B0" font-family="system-ui, sans-serif" font-size="11" font-weight="800">8,420</text>
        </g>

        <!-- Stage 4 -->
        <g transform="translate(85, 126)">
          <rect width="190" height="32" rx="6" fill="#32A88A"/>
          <text x="14" y="21" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Completed Orders</text>
          <text x="145" y="21" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="800">3,400</text>
        </g>
      </g>

      <!-- Creatives Card -->
      <g transform="translate(420, 0)">
        <rect width="240" height="240" rx="10" fill="#15263D" stroke="#243C5E"/>
        <text x="18" y="30" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Top Performing Hook</text>
        <rect x="18" y="45" width="204" height="110" rx="8" fill="#1C3250"/>
        <text x="32" y="75" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="700">&quot;Why 80% of D2C brands</text>
        <text x="32" y="93" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="700">lose money on Meta Ads&quot;</text>
        <rect x="32" y="110" width="70" height="20" rx="4" fill="#EF4444"/>
        <text x="67" y="124" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Hook Rate: 48%</text>

        <rect x="18" y="165" width="204" height="60" rx="6" fill="#182B44" stroke="#274163"/>
        <text x="28" y="188" fill="#4DD8B0" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Creative Iteration Sprint</text>
        <text x="28" y="208" fill="#8BA5C8" font-family="system-ui, sans-serif" font-size="10">12 UGC video hooks tested weekly</text>
      </g>
    </g>
  </g>
</svg>
